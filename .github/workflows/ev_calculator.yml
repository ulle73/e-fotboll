name: EV Calculator

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ev-calculator
  cancel-in-progress: true

jobs:
  ev-calculator:
    runs-on: ubuntu-latest
    env:
      ESB_SITE_ROOT_URL: ${{ secrets.ESB_SITE_ROOT_URL }}
      ESB_ROSTER_INDEX_URL: ${{ secrets.ESB_ROSTER_INDEX_URL }}
      ESB_ROSTER_PROFILE_URL: ${{ secrets.ESB_ROSTER_PROFILE_URL }}
      ESB_ROSTER_COMPARE_URL: ${{ secrets.ESB_ROSTER_COMPARE_URL }}
      ESB_ROSTER_TOURNAMENTS_URL: ${{ secrets.ESB_ROSTER_TOURNAMENTS_URL }}
      ESB_EVENT_RESULTS_URL: ${{ secrets.ESB_EVENT_RESULTS_URL }}
      ESB_EVENT_MATCHES_URL: ${{ secrets.ESB_EVENT_MATCHES_URL }}
      ESB_LEAGUE_INDEX_URL: ${{ secrets.ESB_LEAGUE_INDEX_URL }}
      ESB_LOCATION_INDEX_URL: ${{ secrets.ESB_LOCATION_INDEX_URL }}
      ESB_EVENT_INDEX_URL: ${{ secrets.ESB_EVENT_INDEX_URL }}
      ODDS_STARTING_WITHIN_URL: ${{ secrets.ODDS_STARTING_WITHIN_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          cd ml
          pip install -r requirements.txt
          cd ..

      - name: Install Chrome deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm1 \
            libnss3 \
            libatk-bridge2.0-0 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxcb1 \
            libxdamage1 \
            libxfixes3 \
            libxcomposite1 \
            libxrandr2 \
            libxi6 \
            libcups2 \
            libxkbcommon0 \
            libdrm2 \
            libasound2t64

      - name: Run EV calculator
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONTROL_BOT_TOKEN: ${{ secrets.CONTROL_BOT_TOKEN }}
          CONTROL_BOT_CHAT_ID: ${{ secrets.CONTROL_BOT_CHAT_ID }}
          PUPPETEER_INFO: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --no-zygote --no-first-run"
        run: node src/ev_calculator.js
