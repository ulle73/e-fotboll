name: Train ML Models

on:
  schedule:
    # Run multiple times per day to capture fresh match results
    - cron: "20 4 * * *"   # 04:20 UTC (morgon)
    - cron: "20 12 * * *"  # 12:20 UTC (eftermiddag)
    - cron: "20 20 * * *"  # 20:20 UTC (kväll)
  workflow_dispatch: # Allow manual triggering

jobs:
  train-ml-models:
    runs-on: ubuntu-latest
    env:
      ESB_SITE_ROOT_URL: ${{ secrets.ESB_SITE_ROOT_URL }}
      ESB_ROSTER_INDEX_URL: ${{ secrets.ESB_ROSTER_INDEX_URL }}
      ESB_ROSTER_PROFILE_URL: ${{ secrets.ESB_ROSTER_PROFILE_URL }}
      ESB_ROSTER_COMPARE_URL: ${{ secrets.ESB_ROSTER_COMPARE_URL }}
      ESB_ROSTER_TOURNAMENTS_URL: ${{ secrets.ESB_ROSTER_TOURNAMENTS_URL }}
      ESB_EVENT_RESULTS_URL: ${{ secrets.ESB_EVENT_RESULTS_URL }}
      ESB_EVENT_MATCHES_URL: ${{ secrets.ESB_EVENT_MATCHES_URL }}
      ESB_LEAGUE_INDEX_URL: ${{ secrets.ESB_LEAGUE_INDEX_URL }}
      ESB_LOCATION_INDEX_URL: ${{ secrets.ESB_LOCATION_INDEX_URL }}
      ESB_EVENT_INDEX_URL: ${{ secrets.ESB_EVENT_INDEX_URL }}
      ODDS_STARTING_WITHIN_URL: ${{ secrets.ODDS_STARTING_WITHIN_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Node.js dependencies
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          # Python dependencies
          cd ml
          pip install -r requirements.txt
          cd ..

      - name: Install Chrome deps (for potential scraping)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm1 \
            libnss3 \
            libatk-bridge2.0-0 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxcb1 \
            libxdamage1 \
            libxfixes3 \
            libxcomposite1 \
            libxrandr2 \
            libxi6 \
            libcups2 \
            libxkbcommon0 \
            libdrm2 \
            libasound2t64

      - name: Prepare training data
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          cd ml
          python data_prep.py
          cd ..

      - name: Train ML models
        run: |
          cd ml
          python train.py
          cd ..

      - name: Test integration
        run: |
          cd ml
          node test_integration.js
          cd ..

      - name: Commit updated models (if any)
        run: |
          # Check if models directory has changes
          if [ -n "$(git status --porcelain ml/models/)" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add ml/models/
            git add ml/training_data.csv
            git commit -m "🤖 Auto-update ML models [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          else
            echo "No model changes to commit"
          fi

      - name: Push changes
        if: success()
        run: |
          git push || echo "No changes to push"
